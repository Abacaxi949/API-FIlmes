<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Locadora de filmes</title><link rel="stylesheet" href="/styles.css"></head><body><main><header><p>CATÁLOGO DA LOCADORA</p><h1>Filmes em cartaz</h1><span>Gerencie os títulos do acervo.</span></header><section class="panel"><h2 id="formTitle">Cadastrar filme</h2><form id="form"><label for="titulo">Título do filme</label><div class="row"><input id="titulo" maxlength="160" required placeholder="Ex.: Interestelar"><button id="save">Adicionar filme</button><button id="cancel" class="secondary hidden" type="button">Cancelar</button></div></form><p id="message" role="status"></p></section><section class="catalog"><div class="row head"><h2>Acervo</h2><button class="secondary" id="refresh" type="button">Atualizar lista</button></div><p id="empty">Nenhum filme cadastrado.</p><ul id="films"></ul></section></main><script src="/app.js"></script></body></html>
